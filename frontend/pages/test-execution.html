<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Test Execution - QA Wizard</title>
    <link rel="stylesheet" href="../css/test-execution.css">
</head>
<body>
    <!-- Header -->
    <header class="header">
        <div class="header-content">
            <div class="logo">
                <div class="logo-icon">
                    <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M14.5 2v17.5c0 1.4-1.1 2.5-2.5 2.5h0c-1.4 0-2.5-1.1-2.5-2.5V2"/><path d="M8.5 2h7"/><path d="M14.5 16h-5"/></svg>
                </div>
                <div class="logo-text">
                    <h1>QA Wizard <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m12 3-1.912 5.813a2 2 0 0 1-1.275 1.275L3 12l5.813 1.912a2 2 0 0 1 1.275 1.275L12 21l1.912-5.813a2 2 0 0 1 1.275-1.275L21 12l-5.813-1.912a2 2 0 0 1-1.275-1.275L12 3Z"/></svg></h1>
                    <p>AI Testing Automation</p>
                </div>
            </div>
            <div class="header-actions">
                <div id="ticket-display" class="ticket-badge"></div>
                <button id="btn-home" class="btn btn-ghost">
                    <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m3 9 9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/><polyline points="9 22 9 12 15 12 15 22"/></svg>
                    Home
                </button>
                <button id="btn-reset" class="btn btn-ghost">
                    <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 12a9 9 0 1 0 9-9 9.75 9.75 0 0 0-6.74 2.74L3 8"/><path d="M3 3v5h5"/></svg>
                    Reset
                </button>
            </div>
        </div>
    </header>

    <!-- Stepper -->
    <div class="stepper">
        <div class="stepper-content">
            <div class="step complete"><div class="step-number"><svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="20 6 9 17 4 12"/></svg></div></div>
            <div class="step-connector complete"></div>
            <div class="step complete"><div class="step-number"><svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="20 6 9 17 4 12"/></svg></div></div>
            <div class="step-connector complete"></div>
            <div class="step complete"><div class="step-number"><svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="20 6 9 17 4 12"/></svg></div></div>
            <div class="step-connector complete"></div>
            <div class="step complete"><div class="step-number"><svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="20 6 9 17 4 12"/></svg></div></div>
            <div class="step-connector complete"></div>
            <div class="step active"><div class="step-number">5</div></div>
            <div class="step-connector"></div>
            <div class="step"><div class="step-number">6</div></div>
        </div>
    </div>

    <!-- Main Content -->
    <main class="container">
        <div class="card">
            <div class="card-header">
                <div class="card-header-left">
                    <div class="card-icon">
                        <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polygon points="5 3 19 12 5 21 5 3"/></svg>
                    </div>
                    <div>
                        <h2 class="card-title">Test Execution</h2>
                        <p class="card-description">Run the generated test suite</p>
                    </div>
                </div>
                <button id="btn-run" class="btn btn-primary">
                    <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polygon points="5 3 19 12 5 21 5 3"/></svg>
                    Run Tests
                </button>
            </div>
            
            <div class="card-content">
                <!-- Target URL Input -->
                <div id="target-url-section" class="form-group" style="margin-bottom: 1.5rem;">
                    <label class="form-label">Target Application URL</label>
                    <div style="display: flex; gap: 0.5rem;">
                        <input type="url" id="target-url" class="input" placeholder="http://localhost:5173" value="http://localhost:5173" style="flex: 1;">
                        <button id="btn-verify-url" class="btn btn-outline" type="button">
                            <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12a9 9 0 0 1-9 9m9-9a9 9 0 0 0-9-9m9 9H3m9 9a9 9 0 0 1-9-9m9 9c1.657 0 3-4.03 3-9s-1.343-9-3-9m0 18c-1.657 0-3-4.03-3-9s1.343-9 3-9"/></svg>
                            Verify
                        </button>
                    </div>
                    <p class="form-hint" style="margin-top: 0.5rem; font-size: 0.75rem; color: var(--muted-foreground);">
                        Enter the URL where your React app is running (e.g., http://localhost:5173 for Vite)
                    </p>
                    <div id="url-status" class="hidden" style="margin-top: 0.5rem;"></div>
                </div>

                <!-- Progress Section -->
                <div id="execution-progress" class="progress-section hidden">
                    <div class="progress-header">
                        <span class="progress-label">Executing tests...</span>
                        <span id="progress-value" class="progress-value">0%</span>
                    </div>
                    <div class="progress-bar">
                        <div id="progress-fill" class="progress-fill"></div>
                    </div>
                    <div class="progress-status">
                        <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect width="18" height="18" x="3" y="3" rx="2"/><path d="m9 12 2 2 4-4"/></svg>
                        <span id="progress-text">Running test cases...</span>
                    </div>
                </div>

                <!-- Results Section -->
                <div id="results-summary-section" class="hidden">
                    <!-- Summary -->
                    <div class="results-summary">
                        <div class="summary-item">
                            <span id="total-tests" class="summary-value">0</span>
                            <span class="summary-label">Total Tests</span>
                        </div>
                        <div class="summary-item success">
                            <span id="passed-tests" class="summary-value">0</span>
                            <span class="summary-label">Passed</span>
                        </div>
                        <div class="summary-item error">
                            <span id="failed-tests" class="summary-value">0</span>
                            <span class="summary-label">Failed</span>
                        </div>
                        <div class="summary-item primary">
                            <span id="pass-rate" class="summary-value">0%</span>
                            <span class="summary-label">Pass Rate</span>
                        </div>
                    </div>

                    <!-- Overall Progress -->
                    <div class="overall-progress">
                        <div class="overall-progress-header">
                            <span style="font-size: 0.875rem; color: var(--muted-foreground);">Overall Progress</span>
                            <span id="overall-duration" style="font-size: 0.875rem;">0s</span>
                        </div>
                        <div class="overall-progress-bar">
                            <div id="overall-progress-fill" class="overall-progress-fill" style="width: 0%;"></div>
                        </div>
                    </div>
                </div>
            </div>
        </div>

        <!-- Test Results Card -->
        <div id="execution-results" class="card hidden">
            <div class="card-header">
                <div class="card-header-left">
                    <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="color: var(--primary);"><path d="M3 3v18h18"/><path d="m19 9-5 5-4-4-3 3"/></svg>
                    <h3 style="font-size: 1rem; font-weight: 600;">Test Results</h3>
                </div>
            </div>
            <div class="card-content" style="padding: 0;">
                <div id="test-results-list" class="test-results-list"></div>
            </div>
            <div class="card-footer">
                <button id="btn-back" class="btn btn-outline">
                    <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m12 19-7-7 7-7"/><path d="M19 12H5"/></svg>
                    Back
                </button>
                <button id="btn-proceed" class="btn btn-primary hidden">
                    Proceed to Review
                    <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h14"/><path d="m12 5 7 7-7 7"/></svg>
                </button>
            </div>
        </div>
    </main>

    <script src="../js/test-execution.js"></script>
</body>
</html>
